<!DOCTYPE html>
<html>
<head>
      <title>String Functions </title>
</head>
<body>
     
     <h2>JavaScript String Functions</h2>
      <button onclick="showString()">Show String Details</button>
      <p id="result"></p>

	<script>
		function showString() {
		    let text = "JavaScript Programming";
		    document.getElementById("result").innerHTML =
		        "Original String: " + text + "<br>" +
			"Length: " + text.length + "<br>" +
			"Uppercase: "+ text.toUpperCase() + "<br>" +
			"Lowercase: "+ text.toLowerCase() + "<br>" +
			"Character at index 4: " + text.charAt(4) + "<br>" +
			"Position of 'Script': "+ text.indexOf("Script") + "<br>" +
			"Substring: " + text.substring(0,10);
		}
	</script>
</body>
</html>
