<!DOCTYPE html>
<html>
<head>
	<title>Simple Calculator</title>
	<style>
		body {
		    font-family: Arial, sans-serif;
                    display: flex;
		    justify-content: center;
		    align-items: center;
		    height: 100vh;
		    background-color: #f4f4f4;
	      }
                 .calculator {
		    border: 1px solid #ccc;
		    border-radius: 10px;
		    padding: 20px;
		    bakground-color: white;
		    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

	      }
	        .calculator input {
		    width: 250px;
		    padding: 10px;
		    margin-bottom: 12px;
      		    text-algin: right;
		    font-size: 18px;
		    border: 1px solid #ccc;
		    border-radius: 5px;
	      }
	       .calculator button {
		    width: 20%;
		    padding: 10px;
		    margin: 1%;
      		    font-size: 18px;
		    border: 1px solid #ccc;
		    border-radius: 5px;
		    cursor: pointer;
		    background-color: #f4f4f4;
              }
		.calculator button.operator {
		    background-color: #f0ad4e;
		    color: white;
	      }
	        .calculator button.equal {
		    background-color: #5cb85c;
		    color: white;
	      }
		.calculator button.clear {
	            background-color: #d9534f;
		    color: white;
	      }
	</style>
</head>
<body>
<div class="calculator">
     <input type="text" id="display" disabled>
     <br>
     <button onclick="clearDisplay()" class="clear">C</button>
     <button onclick="show('1')">1</button>
     <button onclick="show('2')">2</button>

     <br>
     <button onclick="show('3')">3</button>
     <button onclick="show('4')">4</button>
     <button onclick="show('5')">5</button>

     <br>
     <button onclick="show('6')">6</button>
     <button onclick="show('7')">7</button>
     <button onclick="show('8')">8</button>

     <br>
     <button onclick="show('9')">9</button>
     <button onclick="show('0')">0</button>
     <button onclick="show('.')" class="operator">.</button>

     <br>
	 <button onclick="show('*')" class="operator">*</button>
	 <button onclick="show('-')" class="operator">-</button>
	 <button onclick="show('+')" class="operator">+</button>

     <button onclick="show('/')" class="operator">/</button>
     <button onclick="calculate()" class="equal">=</button>
<div>

<script>
	function show(value) {
	   document.getElementById('display').value += value;
	}
 
        function clearDisplay() {
	   document.getElementById('display').value = '';
	}
	
	function calculate() {
           let expression = document.getElementById('display').value;
 	   try {
		document.getElementById('display').value = eval(expression);
	   } catch (error) {
		document.getElementById('display').value = 'Error';
	   }
	}
</script> 

</body>
</html>
