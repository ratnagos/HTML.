<!DOCTYPE HTML>
<html>
<head>
	<title>Ordered List Example</title>
</head>
<body>
	<h2>Steps to Make Tea</h2>
	<ol type="I">
	    <li>Boil Water.</li>
	    <li>Add tea leaves.</li>
	    <li>Add milk and sugar.</li> 
	    <li>Boil for 2-3 minutes.</li>
	    <li>Strain and serve.</li>
	</ol>
</body>
</html>
